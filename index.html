<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador de Energia</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Contador de Energia</h1>
    <div id="counter">0</div>
    <div class="buttons">
      <button id="subtract-two">-2</button>
      <button id="subtract-one">-1</button>
      <button id="add-one">+1</button>
      <button id="add-two">+2</button>
      <button id="reset">Descarregar</button>
    </div>

    <!-- Seção de histórico -->
    <div class="history-section">
        <h2>Histórico</h2>
        <div class="history-box">
            <ul id="history-list"></ul>
        </div>
        <button id="clear-history">Limpar Histórico</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
